name: salaama_school
description: Salaama Muslim Junior School - Destined To Succeed - School Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.15.0
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  intl: ^0.19.0
  provider: ^6.1.1
  pdf: ^3.10.0
  printing: ^5.11.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/images/logo.png

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0B6CB3"
    theme_color: "#0B6CB3"